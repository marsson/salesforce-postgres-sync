version: "3.9"

services:
  postgres:
    image: postgres:15
    container_name: dev_postgres
    environment:
      POSTGRES_USER: devuser
      POSTGRES_PASSWORD: devpass
      POSTGRES_DB: devdb
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7
    container_name: dev_redis
    ports:
      - "6379:6379"
    command: [ "redis-server", "--requirepass", "myStrongPassword" ]


volumes:
  postgres_data: